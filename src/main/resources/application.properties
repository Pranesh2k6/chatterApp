# ── Server ───────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── DataSource (MySQL 8) ────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chatter_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:chatter_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Schema initialisation (runs schema.sql on every startup) 
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Session timeout ─────────────────────────────────────────
server.servlet.session.timeout=30m
